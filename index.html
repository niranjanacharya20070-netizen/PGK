<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Purachery Grameena Kalavedhi</title>
<style>
  :root{
    --stage:#1A1210;
    --surface:#28201B;
    --surface-2:#332822;
    --brass:#D8A733;
    --brass-dim:#9C7A2C;
    --maroon:#8C2F3B;
    --ivory:#F6EFE2;
    --muted:#C6B49B;
    --line:#4A3A30;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; min-height:100dvh;
    background:radial-gradient(ellipse at 50% -10%, rgba(216,167,51,0.10), transparent 60%), var(--stage);
    font-family:Georgia, 'Times New Roman', serif;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color:var(--ivory);
    display:flex; justify-content:center;
  }
  .shell{
    width:100%; max-width:480px; min-height:100vh; min-height:100dvh;
    background:var(--stage);
    position:relative; overflow:hidden;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }
  .display{ font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', serif; }
  .mono{ font-family: 'Courier New', Consolas, monospace; }

  .topbar{ padding:26px 22px 16px; border-bottom:1px solid var(--line); }
  .eyebrow{
    font-family:'Courier New', monospace; font-size:10.5px; letter-spacing:0.18em;
    color:var(--brass); text-transform:uppercase; display:flex; align-items:center; gap:7px; margin-bottom:8px;
  }
  .eyebrow .rule{ flex:1; height:1px; background:linear-gradient(to right, var(--brass-dim), transparent); }
  .topbar-inner{ display:flex; align-items:center; gap:13px; }
  .badge{
    width:42px; height:42px; border-radius:50%; border:1.5px solid var(--brass-dim);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    overflow:hidden; flex-shrink:0; position:relative;
  }
  .badge img{ width:100%; height:100%; object-fit:cover; }
  .badge-edit{
    position:absolute; bottom:-3px; right:-3px; width:17px; height:17px; border-radius:50%;
    background:var(--brass); color:var(--stage); display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--stage); cursor:pointer; font-size:9px;
  }
  .title{ font-size:21px; font-weight:700; line-height:1.18; }
  .offline-tag{
    margin-top:6px; font-family:'Courier New', monospace; font-size:10px; letter-spacing:0.06em;
    color:var(--muted); opacity:0.85;
  }

  .body{ padding:22px; padding-bottom:100px; }
  .page{ display:none; }
  .page.active{ display:block; }

  /* Home */
  .nav-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px; }
  .nav-card{
    background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:22px 16px;
    text-align:left; cursor:pointer; position:relative; overflow:hidden;
  }
  .nav-card:active{ background:var(--surface-2); }
  .nav-icon{ font-size:26px; margin-bottom:16px; }
  .nav-label{ font-family:Georgia, serif; font-weight:700; font-size:19px; margin-bottom:4px; }
  .nav-count{ font-family:'Courier New', monospace; font-size:11.5px; color:var(--muted); }

  /* Page header */
  .page-head{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .back-btn{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--line); color:var(--ivory); cursor:pointer; flex-shrink:0;
    font-size:16px;
  }
  .page-title{ font-family:Georgia, serif; font-weight:700; font-size:23px; }
  .page-count{ font-family:'Courier New', monospace; font-size:11px; color:var(--muted); margin-top:2px; }

  .empty{ text-align:center; padding:56px 20px; color:var(--muted); border:1px dashed var(--line); border-radius:6px; }
  .empty-title{ font-family:Georgia, serif; font-size:16px; color:var(--ivory); margin-bottom:6px; }
  .empty-sub{ font-size:13px; line-height:1.5; }

  /* Ticket */
  .ticket{ background:var(--surface); border:1px solid var(--line); border-radius:6px; display:flex; margin-bottom:14px; overflow:hidden; }
  .ticket-main{ flex:1; padding:16px 14px; cursor:pointer; min-width:0; }
  .ticket-place{ font-family:Georgia, serif; font-weight:700; font-size:16.5px; margin-bottom:6px; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .ticket-date{ display:flex; align-items:center; gap:6px; font-family:'Courier New', monospace; font-size:12px; color:var(--brass); }
  .ticket-stub{
    width:52px; flex-shrink:0; border-left:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); color:var(--muted); cursor:pointer; font-size:15px;
  }
  .ticket-stub:active{ color:var(--maroon); }

  /* Ticket status tints — a light wash of colour, never a solid fill, so the text stays easy to read */
  .ticket.status-upcoming{ background:rgba(63,163,86,0.16); border-color:rgba(90,190,115,0.42); }
  .ticket.status-finished{ background:rgba(140,47,59,0.20); border-color:rgba(196,90,102,0.5); }
  .status-badge{
    display:inline-block; font-family:'Courier New', monospace; font-size:9px; letter-spacing:0.08em; text-transform:uppercase;
    padding:2px 7px; border-radius:9px; font-weight:700; flex-shrink:0;
  }
  .status-badge.upcoming{ background:rgba(63,163,86,0.3); color:#A7F0BC; }
  .status-badge.finished{ background:rgba(140,47,59,0.34); color:#F5B7BE; }

  .ticket-actions{
    display:flex; flex-direction:column; gap:8px; flex-shrink:0; padding:12px 10px;
    border-left:1.5px dashed var(--line); align-items:center; justify-content:center;
  }
  .ticket-finish-btn, .ticket-del-btn{
    width:29px; height:29px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); color:var(--muted); border:1px solid var(--line); cursor:pointer; font-size:13px;
  }
  .ticket-finish-btn.is-finished{ color:var(--brass); border-color:var(--brass-dim); }
  .ticket-finish-btn:active{ color:#8FE3A6; border-color:#8FE3A6; }
  .ticket-del-btn:active{ color:var(--maroon); border-color:var(--maroon); }

  /* Session card */
  .session-list{ display:flex; flex-direction:column; gap:12px; }
  .session-card{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px; }
  .session-main{ flex:1; display:flex; align-items:center; gap:13px; cursor:pointer; min-width:0; }
  .session-main:active{ opacity:0.85; }
  .session-arch{
    width:52px; height:58px; border-radius:8px; overflow:hidden; flex-shrink:0;
    border:1.5px solid var(--brass-dim); background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .session-arch img{ width:100%; height:100%; object-fit:cover; }
  .session-name{ font-family:Georgia, serif; font-weight:700; font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .session-count{ font-family:'Courier New', monospace; font-size:11px; color:var(--brass); margin-top:4px; }
  .session-actions{ display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
  .session-edit-btn, .session-del-btn{
    width:29px; height:29px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); color:var(--muted); border:1px solid var(--line); cursor:pointer; font-size:12px;
  }
  .session-del-btn:active{ color:var(--maroon); border-color:var(--maroon); }
  .session-edit-btn:active{ color:var(--brass); border-color:var(--brass); }

  /* Member card */
  .member-list{ display:flex; flex-direction:column; gap:12px; }
  .member-card{ display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px; cursor:pointer; }
  .member-card:active{ background:var(--surface-2); }
  .arch{
    width:52px; height:58px; border-radius:26px 26px 6px 6px; overflow:hidden; flex-shrink:0;
    border:1.5px solid var(--brass-dim); background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .arch img{ width:100%; height:100%; object-fit:cover; }
  .m-name{ font-family:Georgia, serif; font-weight:700; font-size:15.5px; }
  .m-place{ display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); margin-top:3px; }
  .m-songs{ font-family:'Courier New', monospace; font-size:10.5px; color:var(--brass); margin-top:4px; }

  /* Member detail */
  .detail-hero{ text-align:center; padding:6px 0 22px; }
  .arch-lg{
    width:130px; height:150px; border-radius:65px 65px 10px 10px; overflow:hidden; margin:0 auto 16px;
    border:2px solid var(--brass); background:var(--surface); display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 5px var(--surface), 0 0 0 6px var(--line); font-size:34px;
  }
  .arch-lg img{ width:100%; height:100%; object-fit:cover; }
  .detail-name{ font-family:Georgia, serif; font-weight:700; font-size:21px; }
  .detail-row{ display:flex; align-items:center; justify-content:center; gap:7px; font-size:13.5px; color:var(--muted); margin-top:8px; }
  .detail-row a{ color:var(--muted); text-decoration:none; }

  .setlist-head{ display:flex; align-items:center; gap:8px; font-family:'Courier New', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--brass); margin:26px 0 12px; }
  .setlist-head .rule{ flex:1; height:1px; background:var(--line); }
  .setlist{ border-left:2px solid var(--brass-dim); padding-left:16px; }
  .song-row{ display:flex; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .song-row:last-child{ border-bottom:none; }
  .song-num{ font-family:'Courier New', monospace; font-size:11px; color:var(--brass-dim); width:20px; flex-shrink:0; }
  .song-name{ font-size:14.5px; }

  .detail-actions{ display:flex; gap:10px; margin-top:26px; }
  .btn-outline{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:11px; border-radius:5px;
    border:1px solid var(--line); background:transparent; color:var(--ivory); font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn-outline.danger:active{ border-color:var(--maroon); color:var(--maroon); }

  /* Contact actions (Call / WhatsApp) */
  .contact-actions{ display:flex; gap:10px; margin-top:16px; }
  .btn-contact{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:12px;
    border-radius:6px; font-size:13.5px; font-weight:700; text-decoration:none; cursor:pointer; border:none;
  }
  .btn-call{ background:var(--brass); color:var(--stage); }
  .btn-call:active{ background:var(--brass-dim); }
  .btn-whatsapp{ background:#25D366; color:#04240F; }
  .btn-whatsapp:active{ background:#1EBE59; }
  .no-phone-note{ font-size:12px; color:var(--muted); margin-top:14px; text-align:center; }

  /* FAB */
  .fab{
    position:fixed; bottom:26px; left:50%; transform:translateX(calc(-50% + 0px));
    margin-left:0;
  }
  .fab-inner{
    display:flex; align-items:center; gap:8px; background:var(--brass); color:var(--stage); border:none; border-radius:30px;
    padding:13px 20px 13px 16px; font-weight:700; font-size:13.5px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }

  /* Modal */
  .overlay{ position:fixed; inset:0; background:rgba(10,7,6,0.72); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.active{ display:flex; }
  .modal{
    width:100%; max-width:480px; max-height:88vh; overflow-y:auto; background:var(--surface);
    border-top:1px solid var(--line); border-radius:16px 16px 0 0; padding:22px 22px 28px;
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .modal-title{ font-family:Georgia, serif; font-weight:700; font-size:18px; }
  .modal-close{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--muted); cursor:pointer; border:none; font-size:15px; }
  .field{ margin-bottom:16px; }
  .label{ display:block; font-family:'Courier New', monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; }
  .input{
    width:100%; background:var(--stage); border:1px solid var(--line); border-radius:5px; padding:11px 12px;
    color:var(--ivory); font-size:14.5px; outline:none; font-family:inherit;
  }
  .input:focus{ border-color:var(--brass); }
  .input[type="date"]{ color-scheme:dark; }
  .img-upload{ display:flex; align-items:center; gap:14px; }
  .img-upload .arch{ width:64px; height:72px; border-radius:32px 32px 8px 8px; cursor:pointer; }
  .upload-btn{ display:flex; align-items:center; gap:7px; padding:9px 14px; border:1px solid var(--line); border-radius:5px; background:transparent; color:var(--muted); font-size:12.5px; cursor:pointer; }
  .role-toggle{ display:flex; gap:10px; }
  .role-opt{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 10px;
    border:1px solid var(--line); border-radius:6px; background:var(--stage); color:var(--muted); cursor:pointer;
  }
  .role-opt .role-icon{ font-size:20px; }
  .role-opt .role-label{ font-size:13px; font-weight:600; }
  .role-opt.active{ border-color:var(--brass); color:var(--brass); background:rgba(216,167,51,0.08); }
  .song-input-row{ display:flex; gap:8px; margin-bottom:9px; }
  .song-input-row .input{ flex:1; }
  .song-remove{ width:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:5px; color:var(--muted); background:transparent; cursor:pointer; }
  .add-song{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--brass); background:transparent; border:none; cursor:pointer; padding:8px 0; }
  .submit{ width:100%; margin-top:6px; padding:13px; border:none; border-radius:6px; background:var(--brass); color:var(--stage); font-weight:700; font-size:14.5px; cursor:pointer; }
  .submit:disabled{ opacity:0.5; }
  .hidden-input{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  /* Splash */
  .splash{
    position:fixed; inset:0; z-index:80;
    max-width:480px; margin:0 auto;
    background:radial-gradient(ellipse at 50% 30%, rgba(216,167,51,0.14), transparent 62%), var(--stage);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px;
    cursor:pointer; transition:opacity .42s ease;
  }
  .splash.out{ opacity:0; pointer-events:none; }
  .splash-badge{
    width:112px; height:112px; border-radius:50%; border:1.5px solid var(--brass-dim); display:flex; align-items:center; justify-content:center;
    margin-bottom:24px; position:relative; background:var(--surface); overflow:hidden;
  }
  .splash-badge img{ width:100%; height:100%; object-fit:cover; }
  .splash-eyebrow{ font-family:'Courier New', monospace; font-size:10.5px; letter-spacing:0.22em; text-transform:uppercase; color:var(--brass); margin-bottom:12px; }
  .splash-title{ font-family:Georgia, serif; font-weight:700; font-size:25px; line-height:1.22; max-width:300px; }
  .splash-hint{ margin-top:26px; font-size:11.5px; color:var(--muted); }

  /* PIN lock */
  .pinlock{
    position:fixed; inset:0; z-index:85;
    max-width:480px; margin:0 auto;
    background:radial-gradient(ellipse at 50% 30%, rgba(216,167,51,0.14), transparent 62%), var(--stage);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px;
  }
  .pinlock-icon{ font-size:34px; margin-bottom:10px; }
  .pinlock-title{ font-weight:700; font-size:20px; margin-bottom:6px; }
  .pinlock-sub{ font-size:13px; color:var(--muted); margin-bottom:22px; max-width:280px; }
  .pinlock-input{
    max-width:180px; text-align:center; letter-spacing:10px; font-size:20px; margin-bottom:12px;
  }
  .pinlock-error{ color:var(--maroon); font-size:12.5px; margin-bottom:10px; }
  .pinlock-btn{ max-width:180px; }
  .pinlock-reset{ margin-top:24px; font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="eyebrow"><span>&#128293;</span><span>Kalavedhi</span><span class="rule"></span></div>
    <div class="topbar-inner">
      <div class="badge" id="topbarBadge">
        <img id="topbarLogoImg" src="" alt="" style="display:none;">
        <div class="badge-edit" id="logoEditBtn">&#9998;</div>
        <input type="file" accept="image/*" class="hidden-input" id="logoFileInput">
      </div>
      <div class="title display">PURACHERY GRAMEENA KALAVEDHI</div>
    </div>
    <div class="offline-tag">&#9679; <span id="syncStatusText">Live — synced across devices</span> &nbsp;·&nbsp; <span id="changePinLink" style="text-decoration:underline; cursor:pointer;">Change PIN</span> <span id="notifEnableLink" style="text-decoration:underline; cursor:pointer; display:none;">&nbsp;·&nbsp; Enable notifications</span></div>
  </div>

  <div class="body">

    <!-- HOME -->
    <div class="page active" id="page-home">
      <div class="nav-grid">
        <div class="nav-card" id="goSessions">
          <div class="nav-icon">&#128197;</div>
          <div class="nav-label">Seasons</div>
          <div class="nav-count" id="sessionListCount">0 seasons</div>
        </div>
        <div class="nav-card" id="goMembers">
          <div class="nav-icon">&#128101;</div>
          <div class="nav-label">Members</div>
          <div class="nav-count" id="memberCount">0 members</div>
        </div>
      </div>
    </div>

    <!-- SESSIONS LIST -->
    <div class="page" id="page-sessionsList">
      <div class="page-head">
        <div class="back-btn" data-back="home">&#8249;</div>
        <div>
          <div class="page-title">Seasons</div>
          <div class="page-count" id="sessionListPageCount">0 seasons</div>
        </div>
      </div>
      <div id="sessionsListEl"></div>
    </div>

    <!-- PROGRAMS (for a session) -->
    <div class="page" id="page-sessions">
      <div class="page-head">
        <div class="back-btn" data-back="sessionsList">&#8249;</div>
        <div>
          <div class="page-title" id="programsPageTitle">Programs</div>
          <div class="page-count" id="sessionsCount">0 enquiries</div>
        </div>
      </div>
      <div id="programsList"></div>
    </div>

    <!-- MEMBERS -->
    <div class="page" id="page-members">
      <div class="page-head">
        <div class="back-btn" data-back="home">&#8249;</div>
        <div>
          <div class="page-title">Members</div>
          <div class="page-count" id="membersCount">0 members</div>
        </div>
      </div>
      <div id="membersList"></div>
    </div>

    <!-- MEMBER DETAIL -->
    <div class="page" id="page-memberDetail">
      <div class="page-head">
        <div class="back-btn" data-back="members">&#8249;</div>
      </div>
      <div id="memberDetailContent"></div>
    </div>

  </div>

  <div class="fab" id="sessionsListFab" style="display:none;">
    <button class="fab-inner" id="addSessionBtn">&#43; Add season</button>
  </div>
  <div class="fab" id="sessionsFab" style="display:none;">
    <button class="fab-inner" id="addProgramBtn">&#43; Add programme</button>
  </div>
  <div class="fab" id="membersFab" style="display:none;">
    <button class="fab-inner" id="addMemberBtn">&#43; Add member</button>
  </div>

  <!-- SESSION MODAL -->
  <div class="overlay" id="sessionOverlay">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="sessionModalTitle">Add Season</div>
        <button class="modal-close" data-close="sessionOverlay">&#10005;</button>
      </div>
      <div class="field">
        <label class="label">Season image</label>
        <div c
